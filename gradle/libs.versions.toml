platform-velocity = { module = "com.velocitypowered:velocity-api", version = "4.3.0" }
luckperms = { module = "net.luckperms:api", version = "5.5" }
lunachat = { module = "com.github.ucchyocean:LunaChat", version = "3.0.16" }
okochat-legacy = { module = "net.okocraft.okochat:okochat-legacy", version = "0.0.1" }
